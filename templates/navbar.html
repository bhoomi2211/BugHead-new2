<header class="sticky top-0 z-50 glass">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center py-4">
      <a href="/" class="flex items-center space-x-2">
        <div
          class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-900 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6 text-white" viewBox="0 0 100 100" fill="currentColor"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M50 0C22.39 0 0 22.39 0 50s22.39 50 50 50c27.61 0 50-22.39 50-50H60c-5.52 0-10 4.48-10 10v10c0 5.52 4.48 10 10 10h20c0 16.57-13.43 30-30 30S20 66.57 20 50 33.43 20 50 20h40C90 8.96 70.82 0 50 0z" />
          </svg>
        </div>
        <span
          class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary-300 to-primary-500">BUGHEAD</span>
      </a>

      <nav class="hidden md:flex items-center space-x-6">
        <a href="/" class="line-indicator relative text-gray-300 hover:text-white">Home</a>
        <a href="{% url 'dashboard' %}" class="line-indicator relative text-gray-300 hover:text-white">Dashboard</a>
      </nav>

      <div class="hidden md:flex items-center space-x-4">
        {% if request.user.is_authenticated %}
          <span class="text-gray-300">Hi, {{ request.user.username }}</span>
          <a href="{% url 'dashboard' %}"
            class="px-5 py-2 rounded-lg bg-gradient-to-r from-primary-600 to-primary-800 text-white transition duration-300 hover:from-primary-500 hover:to-primary-700">
            Dashboard
          </a>
          <form action="{% url 'logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button type="submit"
              class="px-5 py-2 rounded-lg bg-gradient-to-r from-red-600 to-red-800 text-white transition duration-300 hover:from-red-500 hover:to-red-700">
              Logout
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}"
            class="px-5 py-2 rounded-lg text-gray-200 border border-gray-700 hover:border-primary-500 transition duration-300">Login</a>
          <a href="{% url 'signup' %}"
            class="px-5 py-2 rounded-lg bg-gradient-to-r from-primary-600 to-primary-800 text-white transition duration-300 animate-glow hover:from-primary-500 hover:to-primary-700">Sign
            Up</a>
        {% endif %}
      </div>

      <button id="mobile-menu-button" class="md:hidden text-gray-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="hidden md:hidden glass">
    <div class="py-2 space-y-1">
      <a href="/" class="block px-4 py-2 hover:bg-primary-900 hover:bg-opacity-30">Home</a>
      <a href="{% url 'dashboard' %}" class="block px-4 py-2 hover:bg-primary-900 hover:bg-opacity-30">Dashboard</a>
      <div class="pt-2 px-4 space-y-2">
        {% if request.user.is_authenticated %}
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit"
              class="w-full px-4 py-2 text-center rounded-lg bg-gradient-to-r from-red-600 to-red-800 text-white">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}"
            class="block px-4 py-2 text-center rounded-lg text-gray-200 border border-gray-700 hover:border-primary-500">Login</a>
          <a href="{% url 'signup' %}"
            class="block px-4 py-2 text-center rounded-lg bg-gradient-to-r from-primary-600 to-primary-800 text-white">Sign
            Up</a>
        {% endif %}
      </div>
    </div>
  </div>
</header>

<script>
  const mobileMenuButton = document.getElementById('mobile-menu-button');
  const mobileMenu = document.getElementById('mobile-menu');
  if (mobileMenuButton && mobileMenu) {
    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  }
</script>
