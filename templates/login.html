{% extends 'layout.html' %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  body {
    font-family: 'Inter', sans-serif;
  }

  /* Removed the animation keyframes for gradientMove since we don't need it anymore */

  /* Removed the animate-gradient class properties that caused movement */

  .bg-grid {
    background-image:
      linear-gradient(to right, rgba(99, 102, 241, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .bg-mesh {
    background-image:
      radial-gradient(circle at 25% 25%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 75% 75%, rgba(79, 70, 229, 0.15) 0%, transparent 50%);
  }

  .glass {
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .spin-slow {
    animation: spin 20s linear infinite;
  }

  .animate-glow {
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    0% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); }
    100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); }
  }

  .text-shadow {
    text-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
  }
</style>

<!-- Full-screen Gradient Background with Centered Login -->
<div class="flex flex-col justify-between min-h-screen bg-slate-950 bg-mesh bg-grid text-white font-sans">
  <!-- Removed the animate-gradient class here -->

  <!-- Login Card -->
  <div class="flex items-center justify-center py-10 px-6 relative">
    <!-- Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-32 -left-32 w-64 h-64 bg-primary-600 rounded-full filter blur-3xl opacity-20"></div>
      <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-primary-800 rounded-full filter blur-3xl opacity-20"></div>
    </div>
    
    <div class="w-full max-w-md glass rounded-lg shadow-xl border border-indigo-500 p-8 animate-glow">
      <div class="w-20 h-20 mb-6 mx-auto relative">
        <div class="absolute inset-0 rounded-full bg-gradient-to-br from-indigo-400 to-indigo-700 animate-pulse-slow">
        </div>
        <div class="absolute inset-2 rounded-full bg-slate-950 flex items-center justify-center">
          <svg class="w-10 h-10 text-indigo-400" viewBox="0 0 100 100" fill="currentColor"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M50 0C22.39 0 0 22.39 0 50s22.39 50 50 50c27.61 0 50-22.39 50-50H60c-5.52 0-10 4.48-10 10v10c0 5.52 4.48 10 10 10h20c0 16.57-13.43 30-30 30S20 66.57 20 50 33.43 20 50 20h40C90 8.96 70.82 0 50 0z" />
          </svg>
        </div>
      </div>
      
      <h2 class="text-3xl font-bold text-center mb-6 text-shadow">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 to-indigo-500">Login to Continue</span>
      </h2>

      {% if messages %}
          {% for message in messages %}
              <div class="mt-4 p-3 {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% else %}bg-green-100 text-green-700 border border-green-200{% endif %} rounded-md">
                  {{ message }}
              </div>
          {% endfor %}
      {% endif %}
      
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block text-indigo-200 mb-1">Username</label>
          <input type="text" id="username" name="username" class="w-full px-4 py-2 bg-slate-900/50 text-white border border-indigo-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-200" placeholder="Enter your email" />
        </div>
        <div class="mb-4">
          <label class="block text-indigo-200 mb-1">Password</label>
          <input type="password" id="password" name="password" class="w-full px-4 py-2 bg-slate-900/50 text-white border border-indigo-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-200" placeholder="Enter your password" />
        </div>
        <div class="flex justify-between items-center text-sm text-indigo-300 mb-4">
          <label class="flex items-center">
            <input type="checkbox" class="form-checkbox text-indigo-500" />
            <span class="ml-2">Remember me</span>
          </label>
          <a href="#" class="hover:underline hover:text-indigo-400 transition-all duration-200">Forgot password?</a>
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-gradient-to-r from-indigo-600 to-indigo-800 hover:from-indigo-500 hover:to-indigo-700 rounded-lg text-white font-semibold transition-all duration-200 flex items-center justify-center">
          Login
          <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock content %}
